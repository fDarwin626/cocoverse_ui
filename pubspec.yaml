name: cocoverse_ui
description: "Animated 3D and particle effects for Flutter, drawn with pure Dart painters and tuned for smooth performance."
version: 0.0.1
publish_to: none
homepage:

topics:
  - animation
  - effects
  - particles
  - graphics
  - ui

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  shaders:
    - shaders/glossy_sphere.frag
    - shaders/starfield_sphere.frag
    - shaders/glass_ring.frag